<g font-size="22" font-weight="700"><text x="94" y="144">Scan the broken demo</text><text x="94" y="266">Inspect the evidence</text><text x="94" y="388">Repair and rerun</text><text x="94" y="510">Check manually</text></g>
<g font-size="18"><text x="94" y="177">Before: 4 blocking rules · exit 1</text><text x="94" y="299">Rule → affected node → explanation → fix</text><text x="94" y="421">Corrected counterpart: no blocking violations · exit 0</text><text x="94" y="543">Keyboard · screen reader · zoom · journeys</text></g>
