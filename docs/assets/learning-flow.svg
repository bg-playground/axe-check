<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
<title id="title">From scan findings to better experiences</title>
<desc id="desc">Four steps: scan the broken demo with four blocking rules and exit 1; inspect the JSON evidence; repair and rerun the corrected counterpart with no blocking violations and exit 0; then check keyboard, screen reader, zoom and journeys manually.</desc>
<rect width="640" height="600" rx="20" fill="#f1f5f9"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#17243b">
<text x="32" y="48" font-size="25" font-weight="700">A scan is the start of the lesson.</text>
<text x="32" y="78" font-size="18">Follow the evidence. Keep testing beyond the gate.</text>
